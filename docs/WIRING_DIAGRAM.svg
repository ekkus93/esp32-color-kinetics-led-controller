<text x="986" y="471" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#7752bf">B / −</text>
<text x="809" y="527" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1d354b">DE → 5V   (TX enabled)</text>
<text x="809" y="553" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1d354b">/RE → 5V  (RX disabled)</text>
<text x="809" y="580" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1d354b">RO → not connected</text>
<text x="809" y="604" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#97491f">Confirm A/B labeling in chip datasheet</text>
