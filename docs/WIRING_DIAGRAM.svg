<text x="808" y="299" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5d7488">Verified 5V differential driver</text>
<text x="809" y="332" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#d99219">VCC ← 5V</text>
<text x="809" y="400" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#33475c">GND</text>
