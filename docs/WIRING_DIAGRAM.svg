<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Proposed ESP32-S3 Chromasic to Color Kinetics 4-wire leader wiring</title>
<desc id="desc">24 volt power supply to red and black leader. 24-to-5 volt converter supplies MAX485 driver. USB-powered ESP32 GPIO18 to DI. MAX485 A noninverted to blue white and B inverted to blue. Connector physical pins are not established, so all mappings must be measured before connection.</desc>
<rect width="1600" height="1100" fill="#f4f8fc"/>
<rect width="1600" height="97" fill="#193750"/>
<text x="54" y="57" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#fff">ESP32-S3 + Color Kinetics eW Flex Compact HE</text>
<text x="55" y="83" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#d3e5f4">PROPOSED 4-WIRE DIFFERENTIAL LEADER  |  60 LED NODES  |  24V  |  Chromasic</text>
<rect x="55" y="108" width="1488" height="94" rx="14" fill="#fff1dd" stroke="#e8ad5c" stroke-width="2"/>
<text x="77" y="142" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#932e14">STOP: verify physical wire identities and polarity before connecting power.</text>
<text x="77" y="168" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#8a4c18">Typical leader colors are documented; connector cavity positions and your custom 5-ft leader remain UNVERIFIED.</text>
<text x="77" y="190" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#8a4c18">Do not connect 24V to ESP32; do not attach a second transmitter to an already driven Color Kinetics cable.</text>
