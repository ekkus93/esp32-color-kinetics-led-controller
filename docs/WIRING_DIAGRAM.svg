<text x="75" y="828" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#24465f">CONNECTION TABLE</text>
<text x="77" y="863" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#263c51">24V PSU + (fused)</text>
<text x="392" y="863" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#2b5167">red leader + buck VIN+</text>
<text x="913" y="863" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#587086">24V rail</text>
<text x="77" y="890" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#263c51">24V PSU −</text>
<text x="392" y="890" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#2b5167">black leader + buck VIN− + ESP GND</text>
<text x="913" y="890" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#587086">0V reference</text>
<text x="77" y="917" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#263c51">Buck output +5V</text>
<text x="392" y="917" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#2b5167">MAX485 VCC, DE and /RE</text>
<text x="913" y="917" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#587086">enable TX / disable RX</text>
<text x="77" y="944" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#263c51">Buck GND</text>
<text x="392" y="944" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#2b5167">MAX485 GND</text>
<text x="913" y="944" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#587086">common ground</text>
<text x="77" y="971" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#263c51">ESP32 GPIO18</text>
<text x="392" y="971" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#2b5167">MAX485 DI (3.3V logic)</text>
<text x="913" y="971" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#587086">Chromasic pulses</text>
<text x="77" y="998" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#263c51">MAX485 A (non-inverting)</text>
<text x="392" y="998" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#2b5167">leader blue/white</text>
<text x="913" y="998" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#587086">DATA +</text>
<text x="77" y="1025" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#263c51">MAX485 B (inverting)</text>
<text x="392" y="1025" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#2b5167">leader blue</text>
<text x="913" y="1025" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#587086">DATA −</text>
<text x="77" y="1047" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#99401b">MAX485 RO is NOT CONNECTED. Check 3.3V-to-5V input compatibility; A/B labels differ by vendor.</text>
<text x="58" y="1082" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#536e83">Source: Color Kinetics eW Flex Compact Product Guide; Glen Akins (2019), iColor Flex reverse engineering. Electrical topology only.</text>
